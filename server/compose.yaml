# Dev-default compose: bind-mounts source into the dev target so
# `tsx watch` reloads on edit without a rebuild.
#
# To run the production artifact instead:
#   docker compose --profile prod up --build

services:
  server:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      # container listens on 3000; host port comes from .env (PORT), default 3000
      PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
      - ./package.json:/app/package.json
      # keep the container's node_modules (installed for linux) isolated
      # from whatever the host has installed
      - server_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  server-prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
    env_file: .env
    environment:
      PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  server_node_modules:
